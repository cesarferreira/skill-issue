[package]
name = "skillissue"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Deduplicate agent skills with safe canonical symlinks"
license = "MIT"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/skillissue"

[[bin]]
name = "skillissue"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
console = "0.16"
dialoguer = "0.12"
dirs = "6"
serde = { version = "1", features = ["derive"] }
similar = "2"
tempfile = "3"
toml = "0.9"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
