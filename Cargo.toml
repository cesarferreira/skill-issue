[package]
name = "skill-issue"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Deduplicate agent skills with safe canonical symlinks"
license = "MIT"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/skill-issue"

[[bin]]
name = "si"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
console = "0.16"
crossterm = "0.28"
dialoguer = "0.12"
dirs = "6"
filetime = "0.2"
globset = "0.4"
pathdiff = "0.2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tempfile = "3"
toml = "0.9"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
xattr = "1"

[dev-dependencies]
assert_cmd = "2"
expectrl = "0.9"
predicates = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
